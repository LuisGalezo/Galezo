
# Compila Seven Design para Android (arm64-v8a)
name: Seven Design Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: seven-design-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build Seven Design APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Leer versión
        id: version
        run: |
          VERSION=$(sed -n 's/^sevendesign.version=//p' apps/sevendesign-android/android/gradle.properties)
          if [ -z "$VERSION" ]; then
            echo "::error::No se encontró sevendesign.version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Rust
        run: rustup toolchain install

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: seven-design-android

      - name: Instalar cargo-ndk y Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Compilar APK Release
        working-directory: apps/sevendesign-android/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            "-Psevendesign.abis=arm64-v8a" \
            "-Psevendesign.version=$VERSION" \
            -Psevendesign.unsigned=true \
            --no-daemon

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "$GITHUB_WORKSPACE/dist/SevenDesign-$VERSION.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: SevenDesign-apk
          path: dist/*.apk
          if-no-files-found: error
